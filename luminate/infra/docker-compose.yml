# Luminate-integration deployment of Wellms (API only). Run from this folder:
#   pwsh ./bootstrap.ps1            # once: writes .env with generated secrets
#   docker compose up -d --build
name: luminate-wellms

x-wellms-env: &wellms-env
  APP_NAME: Wellms
  APP_ENV: production
  APP_DEBUG: "false"
  APP_LOG_LEVEL: info
  # Containers log to stderr (collected by Docker). A log FILE is a trap here: anything run as root inside the container
  # (docker exec, artisan) creates it root-owned and php-fpm (www-data) then 500s on every request that logs.
  LOG_CHANNEL: stderr
  APP_KEY: ${APP_KEY:?run bootstrap.ps1}
  APP_URL: http://${LAN_HOST:?}:${API_PORT:-8080}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${DB_NAME:-wellms}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  CACHE_DRIVER: redis
  QUEUE_CONNECTION: redis
  QUEUE_DRIVER: redis
  SESSION_DRIVER: cookie
  BROADCAST_DRIVER: "null"
  MAIL_MAILER: log
  MAIL_DRIVER: log
  TRACKER_ENABLED: "false"
  SENTRY_DSN: ""
  FILESYSTEM_DRIVER: s3
  SCORM_DISK: s3
  H5P_AGGREGATE_ASSETS: "true"
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: ${S3_BUCKET:-wellms}
  AWS_ENDPOINT: http://minio:9000
  AWS_URL: http://${LAN_HOST}:${S3_PORT:-9000}/${S3_BUCKET:-wellms}
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  INITIAL_USER_EMAIL: ${INITIAL_USER_EMAIL:?}
  INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:?}
  JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?}
  JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:?}
  # luminate/tenancy (contract v3 §A.1)
  TENANT_CONTEXT_KEY: ${TENANT_CONTEXT_KEY:?run bootstrap.ps1}
  TENANT_CONTEXT_KEY_PREVIOUS: ${TENANT_CONTEXT_KEY_PREVIOUS:-}
  # Secure by default: NO path is served without a context token and no test fixtures exist. docker-compose.dev.yml
  # opts in to the Swagger exemption and the fixtures; never combine it with a production deployment.
  LUMINATE_TENANCY_EXEMPT_PATHS: ${LUMINATE_TENANCY_EXEMPT_PATHS:-}
  LUMINATE_TENANCY_TEST_FIXTURES: ${LUMINATE_TENANCY_TEST_FIXTURES:-false}
  # Request, job and provisioning work refuses to run if its DB user is one of these (the owner is for migrations only).
  LUMINATE_TENANCY_FORBIDDEN_DB_USERS: ${DB_OWNER_USER:-wellms_owner},${DB_BOOTSTRAP_USER:-db_bootstrap}
  LUMINATE_TENANCY_CONNECTIONS: ${LUMINATE_TENANCY_CONNECTIONS:-shard-1=pgsql}
  LUMINATE_TENANCY_BUCKETS: ${S3_BUCKET:-wellms}
  # Signed webhooks to the Luminate receiver (contract v4 §F). Off until LUMINATE_WEBHOOK_URL is set; the secret is always
  # required so a URL can never be configured without one. https only, unless docker-compose.dev.yml allows http for the test receiver.
  LUMINATE_WEBHOOK_URL: ${LUMINATE_WEBHOOK_URL:-}
  LUMINATE_WEBHOOK_SECRET: ${LUMINATE_WEBHOOK_SECRET:?run bootstrap.ps1}
  LUMINATE_WEBHOOK_ALLOW_HTTP: ${LUMINATE_WEBHOOK_ALLOW_HTTP:-false}
  LUMINATE_WEBHOOK_BACKOFF: ${LUMINATE_WEBHOOK_BACKOFF:-60,300,1800,7200,21600}
  LUMINATE_WEBHOOK_MAX_AGE: ${LUMINATE_WEBHOOK_MAX_AGE:-86400}
  # Registry replica (contract §A.2): tenants are pushed by Luminate (PUT /api/luminate/registry/tenants/{tid}) and reconciled by a
  # periodic signed pull. The key is NOT the tenant-context key. No pull URL = push only (production sets one: it is the safety net).
  LUMINATE_REGISTRY_KEY: ${LUMINATE_REGISTRY_KEY:?run bootstrap.ps1}
  LUMINATE_REGISTRY_KEY_PREVIOUS: ${LUMINATE_REGISTRY_KEY_PREVIOUS:-}
  LUMINATE_REGISTRY_PULL_URL: ${LUMINATE_REGISTRY_PULL_URL:-}
  LUMINATE_REGISTRY_ALLOW_HTTP: ${LUMINATE_REGISTRY_ALLOW_HTTP:-false}
  LUMINATE_REGISTRY_RECONCILE_INTERVAL: ${LUMINATE_REGISTRY_RECONCILE_INTERVAL:-300}
  # Wellms must never autonomously move money (contract §H): its commerce schedule and renewal jobs are off by default
  # (LUMINATE_DISABLED_SCHEDULES / LUMINATE_DENIED_JOBS in the add-on config). failed_jobs is pruned after this many hours.
  LUMINATE_FAILED_JOBS_RETENTION_HOURS: ${LUMINATE_FAILED_JOBS_RETENTION_HOURS:-336}

services:
  postgres:
    image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
    environment:
      POSTGRES_DB: ${DB_NAME:-wellms}
      POSTGRES_USER: ${DB_BOOTSTRAP_USER:-db_bootstrap}
      POSTGRES_PASSWORD: ${DB_BOOTSTRAP_PASSWORD:?}
      DB_OWNER_USER: ${DB_OWNER_USER:-wellms_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?}
      DB_APP_USER: ${DB_APP_USER:-wellms_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      # tenancy SQL primitives: installed by 02-tenancy.sh on first start, re-applied by the add-on migration
      - ../addons/luminate-tenancy/database/sql:/luminate-sql:ro
    healthcheck:
      # -h 127.0.0.1: the temporary init-time server listens on the unix socket only, so a
      # socket check would report healthy before the real server accepts TCP connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.2@sha256:747f1f4078d700806f83d427550a9d8c4d89dd3bf6491449c748c83ad285036e
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-x} ping | grep -q PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - miniodata:/data
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${S3_PORT:-9000}:9000"
    restart: unless-stopped

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-wellms}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        cat > /tmp/policy.json <<EOF
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::$$S3_BUCKET","arn:aws:s3:::$$S3_BUCKET/*"]}]}
        EOF
        mc admin policy create local wellms-bucket-rw /tmp/policy.json
        mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc admin policy attach local wellms-bucket-rw --user "$$S3_ACCESS_KEY" || mc admin user info local "$$S3_ACCESS_KEY" | grep -q wellms-bucket-rw
        echo "minio init done"
    restart: "no"

  migrate:
    build:
      context: ../..
      dockerfile: luminate/infra/Dockerfile
    image: luminate/wellms:1.0.54
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    environment:
      <<: *wellms-env
      DB_USERNAME: ${DB_OWNER_USER:-wellms_owner}
      DB_PASSWORD: ${DB_OWNER_PASSWORD}
    volumes:
      - ./scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    healthcheck:
      disable: true
    restart: "no"

  # Per-tenant baseline data (roles, permissions, first admin, Passport client) as the RLS-bound APP role.
  # Re-run for one tenant: docker compose run --rm provision t-alpha
  provision:
    image: luminate/wellms:1.0.54
    pull_policy: never
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      <<: *wellms-env
      DB_USERNAME: ${DB_APP_USER:-wellms_app}
      DB_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - ./scripts/provision.sh:/provision.sh:ro
      - ./tenants.snapshot.json:/etc/luminate/tenants.json:ro
    entrypoint: ["/bin/sh", "/provision.sh"]
    healthcheck:
      disable: true
    restart: "no"

  api:
    image: luminate/wellms:1.0.54
    pull_policy: never
    depends_on:
      provision: {condition: service_completed_successfully}
    environment:
      <<: *wellms-env
      DB_USERNAME: ${DB_APP_USER:-wellms_app}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DISABLE_HORIZON: "true"
      DISABLE_SCHEDULER: "true"
      DISABLE_DB_MIGRATE: "true"
      DISABLE_DB_SEED: "true"
    healthcheck:
      # The image's own check (artisan health:check) reports healthy about 28 s before php-fpm accepts connections (init.sh is still
      # running), and during that window Caddy answers 502. Healthy must mean "can serve": the FastCGI port is open.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  worker:
    image: luminate/wellms:1.0.54
    pull_policy: never
    depends_on:
      provision: {condition: service_completed_successfully}
    environment:
      <<: *wellms-env
      DB_USERNAME: ${DB_APP_USER:-wellms_app}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DISABLE_PHP_FPM: "true"
      # The stock scheduler loop runs `schedule:run` with NO tenant; every job it dispatches would be refused. The
      # per-tenant scheduler (luminate:schedule:work, driven by the replica) replaces it.
      DISABLE_SCHEDULER: "true"
      DISABLE_DB_MIGRATE: "true"
      DISABLE_DB_SEED: "true"
    restart: unless-stopped

  # Per-tenant scheduler: one `schedule:run` child process per ACTIVE tenant per minute, tenants taken from the replica.
  scheduler:
    image: luminate/wellms:1.0.54
    pull_policy: never
    depends_on:
      provision: {condition: service_completed_successfully}
    environment:
      <<: *wellms-env
      DB_USERNAME: ${DB_APP_USER:-wellms_app}
      DB_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - ./scripts/scheduler.sh:/scheduler.sh:ro
    entrypoint: ["/bin/sh", "/scheduler.sh"]
    healthcheck:
      # healthy while the scheduler loop keeps ticking (it touches this file after every tick)
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/luminate-scheduler.heartbeat 2>/dev/null || echo 0) )) -lt 150"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  caddy:
    image: caddy@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    depends_on: [api]
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${API_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
